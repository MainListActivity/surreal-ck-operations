name: Acceptance probe
# SYS02 AC04: a workflow_dispatch probe that reads its target while the job is in progress and uploads the attested record.
# The service verifies the run id, head SHA, time window and in-progress flag before the record can satisfy an AC.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'URL to read while the job is in progress, or a module path for --module'
        required: true
      kind:
        description: 'url or module'
        required: false
        default: 'url'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Read the target in progress
        run: bun scripts/acceptance-probe.ts --${{ inputs.kind || 'url' }} "${{ inputs.target }}" --out acceptance-probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-probe
          path: acceptance-probe.json
