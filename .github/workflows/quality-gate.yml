name: Quality gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: plugin
      - run: sh plugin/scripts/vendor.sh
      - run: pnpm typecheck
      - run: pnpm typecheck
        working-directory: plugin
      - run: pnpm test:bridge
      - run: pnpm test:service
      - run: pnpm install --frozen-lockfile
        working-directory: owner-end
      - run: pnpm typecheck && pnpm test && pnpm build
        working-directory: owner-end
      - run: pnpm test:comm
      # Fork integration is independently run on the company's installed fork.
      # No upstream database or private production credentials in hosted CI.
      # 发布由下方 release 作业完成：本作业通过后，main 上的合入会迁移云端库并发布 GitHub Release 资产。
  workflow-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker://rhysd/actionlint:1.7.12
  release:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: release-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: 安装依赖（根）
        run: |
          set -eu
          pnpm install --frozen-lockfile
      - name: 安装依赖（plugin）
        working-directory: plugin
        run: |
          set -eu
          pnpm install --frozen-lockfile --ignore-scripts
      - name: 检查版本号未发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          VERSION=$(node -p "require('./plugin/package.json').version")
          if out=$(gh release view "v$VERSION" 2>&1); then
            echo "v$VERSION 已发布：请先在 plugin/package.json 与根 package.json 升版本号" >&2
            exit 1
          elif ! printf '%s' "$out" | grep -qi 'not found'; then
            echo "无法确认 v$VERSION 是否已发布：$out" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: 准备服务目录与迁移凭证
        env:
          MIGRATOR_CLIENT_SECRET: ${{ secrets.MIGRATOR_CLIENT_SECRET }}
        run: |
          set -eu
          [ -n "$MIGRATOR_CLIENT_SECRET" ] || { echo "缺少 secret MIGRATOR_CLIENT_SECRET" >&2; exit 1; }
          HOME_DIR="$RUNNER_TEMP/sck-service-home"
          mkdir -p "$HOME_DIR/private/cloud"
          printf '%s' "$MIGRATOR_CLIENT_SECRET" > "$HOME_DIR/private/cloud/migrator-client-secret"
          chmod 600 "$HOME_DIR/private/cloud/migrator-client-secret"
          echo "SCK_SERVICE_HOME=$HOME_DIR" >> "$GITHUB_ENV"
      - name: 云端公司库迁移（只执行一次）
        env:
          COMPANY_DB_URL: ${{ secrets.COMPANY_DB_URL }}
          IDP_ISSUER: ${{ secrets.IDP_ISSUER }}
          MIGRATOR_CLIENT_ID: ${{ secrets.MIGRATOR_CLIENT_ID }}
        run: |
          set -eu
          bun scripts/company-migrate.ts
      - name: 打包插件发行资产
        run: |
          set -eu
          bun scripts/plugin-package.ts --out "$RUNNER_TEMP/dist" --verify-install
      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          DIST="$RUNNER_TEMP/dist"
          SCHEMA=$(node -p "require(process.argv[1]).requiredSchema" "$DIST/manifest.json")
          gh release create "v$VERSION" \
            "$DIST/sck-company-$VERSION.tgz" "$DIST/manifest.json" "$DIST/node-updater.js" \
            --target "$GITHUB_SHA" \
            --title "sck-company $VERSION" \
            --notes "版本 $VERSION；main 提交 $GITHUB_SHA；云端 schema 版本 $SCHEMA。"
