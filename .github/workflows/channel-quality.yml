name: Channel quality
on:
  pull_request:
  push:
    branches: [main]
jobs:
  channel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: 安装 zsh（真实 zsh 启动文件回归需要它，缺失时测试失败而不是跳过）
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y zsh
          zsh --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:channel
