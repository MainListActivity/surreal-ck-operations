name: Acceptance target
# SYS02 C3: the target run a producer reads while this job is in progress. The notice is the channel; the job stays alive
# long enough for the producer to read it. The server adapter verifies this run/job window and the annotation hash.
on:
  push:
    branches: [lane/a7b6d581-ops-governance]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  target:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish the in-progress barrier annotation
        run: echo "::notice title=acceptance-barrier::target-ready"
      - name: Keep the target in progress while the producer reads the annotation
        run: sleep 60
