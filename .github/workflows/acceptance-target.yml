name: Acceptance target
# SYS02 C3: the target run a producer reads while this job is in progress. The commit status is created immediately and is
# readable by the producer during the job; the server adapter verifies the target run/job window and the status hash.
on:
  push:
    branches: [lane/a7b6d581-ops-governance]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  target:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish the in-progress barrier status
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=pending -f context=acceptance-barrier -f description=target-ready
      - name: Keep the target in progress while the producer reads the status
        run: sleep 60
      - name: Mark the barrier status successful after the read window
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=success -f context=acceptance-barrier -f description=target-read
